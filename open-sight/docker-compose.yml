version: '3.8'

services:
  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: opensight-db
    environment:
      POSTGRES_USER: ${DB_USER:-opensight}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_password}
      POSTGRES_DB: ${DB_NAME:-opensight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opensight}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensight-net
    restart: unless-stopped

  # Redis for Caching & Task Queue
  redis:
    image: redis:7-alpine
    container_name: opensight-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensight-net
    restart: unless-stopped

  # MinIO Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: opensight-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - opensight-net
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: opensight-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-opensight}:${DB_PASSWORD:-changeme_secure_password}@db:5432/${DB_NAME:-opensight}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secure}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - media_storage:/app/data/media
    networks:
      - opensight-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ingest Service (Camera Workers)
  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile.ingest
    container_name: opensight-ingest
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-opensight}:${DB_PASSWORD:-changeme_secure_password}@db:5432/${DB_NAME:-opensight}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      USE_GPU: ${USE_GPU:-false}
    depends_on:
      - db
      - api
    volumes:
      - media_storage:/app/data/media
      - /dev/video0:/dev/video0 # If using local cameras
    networks:
      - opensight-net
    restart: unless-stopped
    # GPU support (uncomment if using NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Retention Worker
  retention:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: opensight-retention
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-opensight}:${DB_PASSWORD:-changeme_secure_password}@db:5432/${DB_NAME:-opensight}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secure}
    depends_on:
      - db
      - minio
    volumes:
      - media_storage:/app/data/media
    networks:
      - opensight-net
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: opensight-frontend
    depends_on:
      - api
    networks:
      - opensight-net
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: opensight-nginx
    ports:
      - "80:80"
      - "443:443" # For TLS termination
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # Mount SSL certs if available
    depends_on:
      - frontend
      - api
    networks:
      - opensight-net
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: opensight-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - opensight-net
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: opensight-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - opensight-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_storage:
  prometheus_data:
  grafana_data:

networks:
  opensight-net:
    driver: bridge
